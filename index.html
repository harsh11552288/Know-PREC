<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know PREC - Your College Guide</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5ff;
    color: #172554;
}

header {
    background: #173b8f;
    color: white;
    padding: 25px 20px;
    border-radius: 0 0 25px 25px;
}

header h1 {
    margin: 0 0 8px;
    font-size: 28px;
}

header p {
    margin: 0;
    color: #dbeafe;
}

main {
    padding: 20px;
    max-width: 700px;
    margin: auto;
}

h2 {
    margin-top: 25px;
}

.search {
    width: 100%;
    padding: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    font-size: 16px;
    margin: 15px 0;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.card {
    background: white;
    padding: 18px 12px;
    border: 0;
    border-radius: 15px;
    text-align: left;
    min-height: 115px;
    box-shadow: 0 3px 10px #0000000a;
    cursor: pointer;
    color: #172554;
}

.card span {
    font-size: 28px;
}

.card h3 {
    margin: 10px 0 5px;
    font-size: 16px;
}

.card p {
    margin: 0;
    font-size: 12px;
    color: #64748b;
}

.panel {
    background: white;
    padding: 20px;
    border-radius: 16px;
    margin-top: 20px;
    line-height: 1.6;
    box-shadow: 0 3px 10px #0000000a;
}

.back {
    background: #173b8f;
    color: white;
    padding: 12px 18px;
    border: 0;
    border-radius: 9px;
    margin-top: 12px;
    cursor: pointer;
    font-size: 15px;
}

.map-frame {
    width: 100%;
    overflow: auto;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    background: white;
}

.map-frame img {
    display: block;
    width: 100%;
    height: auto;
}

.room-list {
    list-style: none;
    padding: 0;
}

.room-list li {
    background: #f2f5ff;
    margin: 9px 0;
    padding: 12px;
    border-radius: 10px;
}

.room-number {
    color: #173b8f;
    font-weight: bold;
}

.info-card {
    background: #f2f5ff;
    padding: 15px;
    border-radius: 12px;
    margin: 12px 0;
}

footer {
    text-align: center;
    padding: 25px;
    color: #64748b;
    font-size: 13px;
}

@media (max-width: 360px) {
    main {
        padding: 14px;
    }

    .card {
        padding: 14px 10px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎓 Know PREC</h1>
    <p>Your campus. Your guide.</p>
</header>

<main>

<h2>Welcome, Fresher! 👋</h2>
<p>What are you looking for today?</p>

<input
    class="search"
    id="search"
    type="search"
    placeholder="Search classrooms, labs, buses..."
    oninput="searchCards()"
>

<div class="grid" id="grid">

    <button class="card" onclick="openPage('map')">
        <span>🗺️</span>
        <h3>Campus Map</h3>
        <p>View the A-Wing first-floor plan</p>
    </button>

    <button class="card" onclick="openPage('rooms')">
        <span>🏫</span>
        <h3>Classrooms & Labs</h3>
        <p>Find rooms and laboratories</p>
    </button>

    <button class="card" onclick="openPage('faculty')">
        <span>👨‍🏫</span>
        <h3>Faculty</h3>
        <p>Find faculty and offices</p>
    </button>

    <button class="card" onclick="openPage('bus')">
        <span>🚌</span>
        <h3>Bus Information</h3>
        <p>Routes and timings</p>
    </button>

    <button class="card" onclick="openPage('hostel')">
        <span>🏠</span>
        <h3>Hostel & Mess</h3>
        <p>Explore student facilities</p>
    </button>

    <button class="card" onclick="openPage('seniors')">
        <span>🤝</span>
        <h3>Ask Seniors</h3>
        <p>Get help from seniors</p>
    </button>

</div>

<section id="details"></section>

</main>

<footer>
    Know PREC · Made for freshers ❤️
</footer>

<script>

// Campus map image
const campusMap = "wing-a-map.jpg";

// Classroom and laboratory information
const rooms = [
    {
        name: "Central Computer Lab-2",
        number: "A101"
    },
    {
        name: "Central Computer Lab",
        number: "A102"
    },
    {
        name: "Classroom",
        number: "A103"
    },
    {
        name: "Civil Classroom-1",
        number: "A104"
    },
    {
        name: "Civil Classroom-2",
        number: "A105"
    },
    {
        name: "Mechanical Drawing Hall",
        number: "A106"
    },
    {
        name: "Ladies Toilet",
        number: "A107"
    },
    {
        name: "Mechanical Classroom-1",
        number: "A108"
    },
    {
        name: "Mechanical Classroom-2",
        number: "A109"
    },
    {
        name: "Mechanical Classroom-3",
        number: "A110"
    },
    {
        name: "Mechanical Classroom-4",
        number: "A111"
    }
];

// App page information
const pages = {

    map: {
        title: "🗺️ Campus Map",
        content: `
            <p>
                <strong>Pravara Rural Engineering College, Loni</strong>
            </p>

            <p>
                A-Wing — First Floor
            </p>

            <div class="map-frame">
                <img
                    src="${campusMap}"
                    alt="A-Wing first-floor campus map"
                    onerror="this.style.display='none'; document.getElementById('mapError').style.display='block';"
                >
            </div>

            <p id="mapError" style="display:none;color:#b91c1c;">
                The map image could not be loaded.
                Make sure wing-a-map.jpg is uploaded to the same
                GitHub repository as index.html.
            </p>

            <p>
                Use this map to locate classrooms and laboratories
                on the A-Wing first floor.
            </p>
        `
    },

    rooms: {
        title: "🏫 Classrooms & Labs",
        content: `
            <p>
                A-Wing — First Floor
            </p>

            <div class="map-frame">
                <img
                    src="${campusMap}"
                    alt="A-Wing classroom and laboratory map"
                    onerror="this.style.display='none'; document.getElementById('roomsMapError').style.display='block';"
                >
            </div>

            <p id="roomsMapError" style="display:none;color:#b91c1c;">
                Map unavailable. Check that wing-a-map.jpg
                is uploaded to your repository.
            </p>

            <h3>Room Directory</h3>

            <input
                class="search"
                id="roomSearch"
                type="search"
                placeholder="Search room name or number..."
                oninput="searchRooms()"
            >

            <ul class="room-list" id="roomList">
                ${rooms.map(room => `
                    <li>
                        <strong>${room.name}</strong><br>
                        Room:
                        <span class="room-number">${room.number}</span>
                    </li>
                `).join("")}
            </ul>

            <p>
                Check the map above to understand the room layout.
            </p>
        `
    },

    faculty: {
        title: "👨‍🏫 Faculty",
        content: `
            <p>
                Find faculty members and their office locations here.
            </p>

            <div class="info-card">
                <h3>Faculty Directory</h3>
                <p>
                    Faculty names, departments, contact details and
                    office locations will be added after verification.
                </p>
            </div>

            <p>
                Only verified faculty information should be added
                to this directory.
            </p>
        `
    },

    bus: {
        title: "🚌 Bus Information",
        content: `
            <p>
                Find college transportation information here.
            </p>

            <div class="info-card">
                <h3>Bus Routes</h3>
                <p>
                    Bus routes, stops and timings will be added
                    after confirmation from the college.
                </p>
            </div>

            <div class="info-card">
                <h3>Driver Contact Details</h3>
                <p>
                    Verified bus driver contact details can be
                    added here when available.
                </p>
            </div>
        `
    },

    hostel: {
        title: "🏠 Hostel & Mess",
        content: `
            <div class="info-card">
                <h3>Hostel Information</h3>
                <p>
                    Hostel facilities, rules, room information
                    and contact details will be added here.
                </p>
            </div>

            <div class="info-card">
                <h3>Mess Information</h3>
                <p>
                    Mess timings, menu and student reviews
                    will be added here.
                </p>
            </div>
        `
    },

    seniors: {
        title: "🤝 Ask Seniors",
        content: `
            <p>
                New to college? Get help from experienced students.
            </p>

            <div class="info-card">
                <h3>Ask a Senior</h3>
                <p>
                    Senior contact details and assistance
                    information will be added after permission
                    and verification.
                </p>
            </div>

            <p>
                You can use this section to help freshers with
                classrooms, laboratories, college facilities
                and general campus questions.
            </p>
        `
    }

};

// Open a selected page
function openPage(pageName) {

    const page = pages[pageName];

    if (!page) {
        return;
    }

    document.getElementById("grid").style.display = "none";
    document.getElementById("search").style.display = "none";

    const details = document.getElementById("details");

    details.innerHTML = `
        <div class="panel">
            <h2>${page.title}</h2>

            ${page.content}

            <button class="back" onclick="goHome()">
                ← Back to Home
            </button>
        </div>
    `;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

// Return to the home screen
function goHome() {

    document.getElementById("details").innerHTML = "";

    document.getElementById("grid").style.display = "grid";
    document.getElementById("search").style.display = "block";

    document.getElementById("search").value = "";

    searchCards();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

// Search the home screen cards
function searchCards() {

    const query = document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const cards = document.querySelectorAll("#grid .card");

    cards.forEach(card => {

        const text = card.innerText.toLowerCase();

        card.style.display = text.includes(query)
            ? "block"
            : "none";

    });
}

// Search classrooms and laboratories
function searchRooms() {

    const query = document
        .getElementById("roomSearch")
        .value
        .toLowerCase()
        .trim();

    const listItems = document.querySelectorAll("#roomList li");

    listItems.forEach(item => {

        const text = item.innerText.toLowerCase();

        item.style.display = text.includes(query)
            ? "block"
            : "none";

    });
}

</script>

</body>
</html>
