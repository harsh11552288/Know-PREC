*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f5ff;color:#172554}
header{background:#173b8f;color:white;padding:25px 20px;border-radius:0 0 25px 25px}

main{padding:20px;max-width:700px;margin:auto}
h2{margin-top:25px}
.search{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px;margin:15px 0}

.panel{background:white;padding:20px;border-radius:16px;margin-top:20px;line-height:1.6;box-shadow:0 3px 10px #0000000a}
.faculty-card{background:#f2f5ff;padding:16px;border-radius:12px;margin:15px 0}
.faculty-card h3{margin-top:0;color:#173b8f}
.back{background:#173b8f;color:white;padding:12px 18px;border:0;border-radius:9px;margin-top:12px;cursor:pointer;font-size:15px}
.map-frame{width:100%;overflow:auto;border:1px solid #cbd5e1;border-radius:12px;background:#fff}
.map-frame img{display:block;width:100%;height:auto}
.map-note{font-size:13px;color:#64748b}

  function openPage(page) {
  const data = pages[page];
  if (!data) return;

  document.getElementById("details").innerHTML =
    `<div class="panel">
      <h2>${data.title}</h2>
      ${data.text}
      <button class="back" onclick="goHome()">← Back to Home</button>
    </div>`;

  document.getElementById("grid").style.display = "none";
  document.getElementById("details").style.display = "block";
}

function goHome() {
  document.getElementById("details").innerHTML = "";
  document.getElementById("details").style.display = "none";
  document.getElementById("grid").style.display = "grid";
}

function searchCards() {
  const q = document.getElementById("search").value.toLowerCase();

  document.querySelectorAll(".card").forEach(card => {
    card.style.display = card.innerText.toLowerCase().includes(q)
      ? "block"
      : "none";
  });
    }
